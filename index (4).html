<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Click Ninjagaming</title>
<style>
  :root{
    --bg-0:#05060f;
    --bg-1:#0a0e1f;
    --neon-cyan:#00f0ff;
    --neon-pink:#ff2ee6;
    --neon-purple:#9b30ff;
    --neon-green:#39ff88;
    --neon-yellow:#ffe600;
    --lane-line:#1c2340;
    --danger:#ff2b4e;
    --pfp-url: none;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:radial-gradient(circle at 50% 20%, #131a33 0%, var(--bg-0) 60%);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    color:#eaf6ff;
  }
  #app{
    position:relative;
    width:100%; height:100%;
    max-width:520px;
    margin:0 auto;
    background:linear-gradient(180deg, var(--bg-1), #060810 90%);
    box-shadow:0 0 60px rgba(0,240,255,0.08), inset 0 0 120px rgba(0,0,0,0.6);
    overflow:hidden;
    border-left:1px solid rgba(0,240,255,0.15);
    border-right:1px solid rgba(0,240,255,0.15);
  }

  /* ---------- HUD ---------- */
  #hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 16px;
    z-index:10;
    background:linear-gradient(180deg, rgba(5,6,15,0.9), rgba(5,6,15,0));
    pointer-events:none;
  }
  .hud-box{ text-align:center; }
  .hud-label{ font-size:10px; letter-spacing:2px; color:#7fa8c9; text-transform:uppercase; }
  .hud-value{
    font-size:22px; font-weight:800;
    color:var(--neon-cyan);
    text-shadow:0 0 10px var(--neon-cyan), 0 0 24px rgba(0,240,255,0.5);
    font-variant-numeric: tabular-nums;
  }
  #comboWrap{
    position:absolute; top:66px; left:50%; transform:translateX(-50%);
    z-index:10; pointer-events:none;
    font-size:16px; font-weight:800; letter-spacing:1px;
    color:var(--neon-yellow);
    text-shadow:0 0 12px var(--neon-yellow);
    opacity:0; transition:opacity .15s ease, transform .15s ease;
  }
  #comboWrap.show{ opacity:1; }

  /* ---------- Game area ---------- */
  #gameArea{ position:absolute; top:0; left:0; right:0; bottom:0; }
  #lanes{ position:absolute; top:0; left:0; right:0; bottom:110px; display:flex; }
  .lane{ flex:1; position:relative; border-right:1px solid var(--lane-line); }
  .lane:last-child{ border-right:none; }

  .tile{
    position:absolute;
    left:6%; width:88%;
    height:130px;
    border-radius:16px;
    background:linear-gradient(160deg, #1c2560, #0d1230 70%);
    background-size:cover;
    background-position:center;
    border:2px solid var(--neon-purple);
    box-shadow:0 0 18px rgba(155,48,255,0.55), inset 0 0 20px rgba(155,48,255,0.15);
    display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:10px;
    transition: box-shadow .1s ease;
    overflow:hidden;
  }
  /* Added by JS when pfp.png is found — fills the tile with the image */
  .tile.has-pfp{ background-image:var(--pfp-url); }
  .tile::before{
    content:'';
    position:absolute; top:8px; left:8px; right:8px; bottom:8px;
    border-radius:10px;
    background:
      linear-gradient(rgba(0,0,0,0.12), rgba(0,0,0,0.32)),
      repeating-linear-gradient(45deg, rgba(0,240,255,0.06) 0 2px, transparent 2px 8px);
    pointer-events:none;
  }
  .tile .glyph{ font-size:26px; opacity:.9; filter:drop-shadow(0 0 6px var(--neon-cyan)); }
  .tile.hitflash{
    background:linear-gradient(160deg, var(--neon-cyan), #0d1230 70%);
    box-shadow:0 0 40px var(--neon-cyan);
  }
  .tile.danger{
    border-color:var(--danger);
    box-shadow:0 0 18px rgba(255,43,78,0.6);
  }

  #hitLine{
    position:absolute; left:0; right:0; bottom:110px;
    height:4px;
    background:linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
    box-shadow:0 0 16px var(--neon-cyan);
    z-index:5;
  }

  .burst{
    position:absolute; width:8px; height:8px; border-radius:50%;
    pointer-events:none;
    background:var(--neon-cyan);
    box-shadow:0 0 8px var(--neon-cyan);
  }

  /* ---------- Bottom bar / strike indicator ---------- */
  #bottomBar{
    position:absolute; bottom:0; left:0; right:0; height:110px;
    background:linear-gradient(0deg, #05060f 60%, rgba(5,6,15,0));
    display:flex; align-items:center; justify-content:center; gap:10px;
    z-index:8;
  }
  .life{ width:16px; height:16px; border-radius:50%; background:var(--neon-pink); box-shadow:0 0 10px var(--neon-pink); }
  .life.lost{ background:#2a2f45; box-shadow:none; }

  /* ---------- Overlays ---------- */
  .overlay{
    position:absolute; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 30%, rgba(20,10,40,0.92), rgba(3,4,10,0.97));
    text-align:center; padding:24px;
  }
  .hidden{ display:none !important; }

  .title-logo{
    font-size:44px; font-weight:900; letter-spacing:2px;
    background:linear-gradient(90deg, var(--neon-cyan), var(--neon-pink), var(--neon-purple));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 30px rgba(0,240,255,0.4);
    margin-bottom:2px;
  }
  .subtitle{ color:#9db6d6; font-size:13px; letter-spacing:3px; text-transform:uppercase; margin-bottom:26px; }
  .subtitle b{ color:var(--neon-green); }

  .btn{
    appearance:none; border:none; cursor:pointer;
    padding:14px 38px;
    font-size:16px; font-weight:800; letter-spacing:1px;
    border-radius:30px; color:#04060d;
    background:linear-gradient(90deg, var(--neon-cyan), var(--neon-green));
    box-shadow:0 0 25px rgba(0,240,255,0.5);
    margin-top:8px;
    transition:transform .1s ease;
  }
  .btn:active{ transform:scale(0.95); }
  .btn.secondary{
    background:transparent; color:var(--neon-cyan);
    border:2px solid var(--neon-cyan);
    box-shadow:0 0 12px rgba(0,240,255,0.3);
  }

  .stat-row{ display:flex; gap:26px; margin:18px 0 6px; }
  .stat{ text-align:center; }
  .stat .num{ font-size:28px; font-weight:900; color:var(--neon-yellow); text-shadow:0 0 14px rgba(255,230,0,0.6); }
  .stat .lbl{ font-size:11px; color:#89a4c4; letter-spacing:2px; text-transform:uppercase; }

  #diffRow{ display:flex; gap:10px; margin:18px 0; }
  .diffBtn{
    padding:8px 16px; border-radius:20px; font-size:12px; font-weight:700;
    background:#10162e; border:2px solid #263258; color:#b7c9e6; cursor:pointer;
    letter-spacing:1px;
  }
  .diffBtn.active{
    border-color:var(--neon-purple); color:#fff;
    box-shadow:0 0 14px rgba(155,48,255,0.6);
    background:#1c1240;
  }

  #bpmRow{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    margin:6px 0 14px; font-size:12px; color:#9db6d6; letter-spacing:1px;
  }
  #bpmRow label{ text-transform:uppercase; font-size:11px; }
  #bpmInput{
    width:80px; text-align:center; padding:6px 8px; border-radius:8px;
    border:2px solid #263258; background:#10162e; color:var(--neon-cyan);
    font-size:14px; font-weight:700;
  }
  .bpmToggle{ display:flex; align-items:center; gap:6px; cursor:pointer; font-size:11px; color:#b7c9e6; }
  .bpmToggle input{ cursor:pointer; }

  footer.credit{ position:absolute; bottom:8px; font-size:10px; color:#5b6f8f; letter-spacing:1px; }

  /* ---------- Front-page logo ----------
     This is the ONLY image tag you need to touch for the start-screen logo.
     src="logo.png" -> put logo.png in the SAME FOLDER as this index.html file.
     If you want it in a subfolder, e.g. assets/logo.png, change src accordingly.
  */
  .logo-img{
    max-width:220px;
    max-height:140px;
    margin-bottom:14px;
    filter:drop-shadow(0 0 18px rgba(0,240,255,0.5));
    border-radius:16px;
  }

  .flash-text{
    position:absolute; font-weight:900; font-size:22px; pointer-events:none;
    color:var(--neon-green); text-shadow:0 0 12px var(--neon-green);
    animation:floatUp .6s ease forwards;
    z-index:20;
  }
  @keyframes floatUp{
    0%{ opacity:1; transform:translateY(0) scale(1); }
    100%{ opacity:0; transform:translateY(-50px) scale(1.2); }
  }
</style>
</head>
<body>
<div id="app">

  <!-- HUD -->
  <div id="hud">
    <div class="hud-box">
      <div class="hud-label">Score</div>
      <div class="hud-value" id="scoreVal">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">CPS</div>
      <div class="hud-value" id="cpsVal">0.0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Best</div>
      <div class="hud-value" id="bestVal">0</div>
    </div>
  </div>
  <div id="comboWrap">COMBO x<span id="comboVal">0</span></div>

  <!-- Game -->
  <div id="gameArea">
    <div id="lanes">
      <div class="lane" data-lane="0"></div>
      <div class="lane" data-lane="1"></div>
      <div class="lane" data-lane="2"></div>
      <div class="lane" data-lane="3"></div>
    </div>
    <div id="hitLine"></div>
    <div id="bottomBar">
      <div class="life" id="life0"></div>
      <div class="life" id="life1"></div>
      <div class="life" id="life2"></div>
    </div>
  </div>

  <!-- Start overlay -->
  <div class="overlay" id="startOverlay">
    <!--
      LOGO: this img tag shows logo.png from the same folder as index.html.
      To use your own file: just make sure a file named exactly "logo.png"
      (same case, same extension) sits next to index.html. Nothing else to edit.
    -->
    <img src="logo.png" alt="logo" class="logo-img" onerror="this.style.display='none'">
    <div class="title-logo">Click Ninjagaming</div>
    <div class="subtitle">a <b>Ninjagaming</b> speed-click challenge</div>
    <div id="diffRow">
      <button class="diffBtn" data-speed="1600">EASY</button>
      <button class="diffBtn active" data-speed="1100">NORMAL</button>
      <button class="diffBtn" data-speed="750">HARD</button>
      <button class="diffBtn" data-speed="480">INSANE</button>
    </div>
    <div id="bpmRow">
      <label for="bpmInput">SONG BPM</label>
      <input type="number" id="bpmInput" value="128" min="40" max="240" step="1">
      <label class="bpmToggle"><input type="checkbox" id="bpmSyncToggle" checked> Sync tiles to beat</label>
    </div>
    <button class="btn" id="startBtn">TAP TO START</button>
    <footer class="credit">Fan-made mini game · inspired by Roblox gaming content</footer>
  </div>

  <!-- Game over overlay -->
  <div class="overlay hidden" id="overOverlay">
    <div class="title-logo" style="font-size:32px;">GAME OVER</div>
    <div class="stat-row">
      <div class="stat"><div class="num" id="finalScore">0</div><div class="lbl">Score</div></div>
      <div class="stat"><div class="num" id="finalCps">0.0</div><div class="lbl">Avg CPS</div></div>
      <div class="stat"><div class="num" id="finalCombo">0</div><div class="lbl">Best Combo</div></div>
    </div>
    <button class="btn" id="retryBtn">RETRY</button>
    <button class="btn secondary" id="menuBtn">MENU</button>
  </div>

</div>

<!--
  ASSET SETUP — drop these files in the SAME folder as index.html:
    1) logo.png   -> shown on the start screen (see .logo-img / img tag above)
    2) pfp.png    -> profile picture shown inside each falling tile
    3) theme.mp3  -> background music, plays on start / stops on game over
  logo.png has no fallback detection — if it's missing, the browser just
  hides that broken image (onerror handles that) and shows the text title
  right below it, so nothing looks broken either way.
  pfp.png and theme.mp3 DO have auto-detection built into the script below.
-->
<audio id="bgMusic" src="theme.mp3" loop preload="auto"></audio>

<script>
(function(){
  const app = document.getElementById('app');
  const laneEls = Array.from(document.querySelectorAll('.lane'));
  const scoreVal = document.getElementById('scoreVal');
  const cpsVal = document.getElementById('cpsVal');
  const bestVal = document.getElementById('bestVal');
  const comboWrap = document.getElementById('comboWrap');
  const comboVal = document.getElementById('comboVal');
  const startOverlay = document.getElementById('startOverlay');
  const overOverlay = document.getElementById('overOverlay');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const menuBtn = document.getElementById('menuBtn');
  const diffBtns = Array.from(document.querySelectorAll('.diffBtn'));
  const lifeEls = [document.getElementById('life0'), document.getElementById('life1'), document.getElementById('life2')];

  const GLYPHS = ['⚡','🔥','💠','🟣','🟢','⭐'];

  // ---- Profile picture auto-detect (tiles) ----
  const PFP_PATH = 'pfp.png';
  let pfpReady = false;
  (function checkPfp(){
    const testImg = new Image();
    testImg.onload = () => {
      pfpReady = true;
      document.documentElement.style.setProperty('--pfp-url', `url('${PFP_PATH}')`);
    };
    testImg.onerror = () => { pfpReady = false; };
    testImg.src = PFP_PATH;
  })();

  // ---- Music auto-detect ----
  const bgMusic = document.getElementById('bgMusic');
  let musicReady = false;
  bgMusic.addEventListener('canplaythrough', () => { musicReady = true; }, { once:true });
  bgMusic.addEventListener('error', () => { musicReady = false; });

  let fallDurationMs = 1100;      // current effective fall speed (may be sped up near song end)
  let baseFallDurationMs = 1100;  // the difficulty-selected fall speed, unaffected by end-of-song ramp
  let running = false;
  let score = 0;
  let combo = 0;
  let bestCombo = 0;
  let lives = 3;
  let clickTimestamps = [];
  let best = Number(localStorage.getItem('tileRushBest') || 0);
  bestVal.textContent = best;

  let spawnTimer = null;
  let cpsInterval = null;
  let tiles = [];
  let laneHeight = 0;
  let beatCheckInterval = null;
  let nextBeatTime = 0;
  let beatIntervalSec = 60/128;

  function updateLaneHeight(){
    laneHeight = laneEls[0].getBoundingClientRect().height;
  }
  window.addEventListener('resize', updateLaneHeight);

  function setDifficulty(ms){
    fallDurationMs = ms;
    baseFallDurationMs = ms;
    diffBtns.forEach(b => b.classList.toggle('active', Number(b.dataset.speed) === ms));
    bgMusic.playbackRate = ms <= 750 ? 1.15 : 1.0;
  }
  diffBtns.forEach(b => {
    b.addEventListener('click', () => setDifficulty(Number(b.dataset.speed)));
  });

  function resetLives(){
    lives = 3;
    lifeEls.forEach(el => el.classList.remove('lost'));
  }

  function loseLife(){
    lives -= 1;
    if(lifeEls[lives]) lifeEls[lives].classList.add('lost');
    if(lives <= 0){
      endGame();
    }
  }

  function spawnTile(){
    if(!running) return;
    updateLaneHeight();
    const laneIndex = Math.floor(Math.random() * 4);
    const tileEl = document.createElement('div');
    tileEl.className = 'tile';
    if(pfpReady){
      tileEl.classList.add('has-pfp');
    } else {
      const glyph = document.createElement('div');
      glyph.className = 'glyph';
      glyph.textContent = GLYPHS[Math.floor(Math.random()*GLYPHS.length)];
      tileEl.appendChild(glyph);
    }
    tileEl.style.top = '-140px';
    laneEls[laneIndex].appendChild(tileEl);

    const tileObj = { el: tileEl, lane: laneIndex, hit:false, missed:false, startTime: performance.now() };
    tiles.push(tileObj);

    animateTile(tileObj);

    tileEl.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      hitTile(tileObj);
    });

    if(!beatSyncActive()){
      const nextDelay = fallDurationMs * (0.55 + Math.random()*0.25);
      spawnTimer = setTimeout(spawnTile, nextDelay);
    }
  }

  function beatSyncActive(){
    return document.getElementById('bpmSyncToggle').checked && musicReady;
  }

  function applyEndOfSongRamp(){
    const dur = bgMusic.duration;
    if(!dur || !isFinite(dur) || dur <= 0 || !musicReady) return 1;
    const RAMP_ZONE = 0.20;
    const MAX_SPEEDUP = 1.8;
    const remaining = dur - bgMusic.currentTime;
    const remainingFrac = Math.max(0, remaining / dur);
    let speedMult = 1;
    if(remainingFrac < RAMP_ZONE){
      const rampProgress = 1 - (remainingFrac / RAMP_ZONE);
      speedMult = 1 + rampProgress * (MAX_SPEEDUP - 1);
    }
    fallDurationMs = Math.max(300, baseFallDurationMs / speedMult);
    return speedMult;
  }

  function startBeatLoop(){
    const bpmInput = document.getElementById('bpmInput');
    const baseBpm = Math.max(40, Math.min(240, Number(bpmInput.value) || 128));
    nextBeatTime = bgMusic.currentTime + 0.15;
    clearInterval(beatCheckInterval);
    beatCheckInterval = setInterval(() => {
      if(!running || !beatSyncActive()) return;
      const speedMult = applyEndOfSongRamp();
      beatIntervalSec = (60 / baseBpm) / speedMult;
      while(bgMusic.currentTime >= nextBeatTime){
        spawnTile();
        nextBeatTime += beatIntervalSec;
      }
    }, 30);
  }

  function startFreeRunRampWatcher(){
    clearInterval(beatCheckInterval);
    beatCheckInterval = setInterval(() => {
      if(!running) return;
      applyEndOfSongRamp();
    }, 200);
  }

  function animateTile(tileObj){
    const travel = laneHeight + 140;
    function step(now){
      if(tileObj.hit || tileObj.missed) return;
      const elapsed = now - tileObj.startTime;
      const progress = elapsed / fallDurationMs;
      const topPos = -140 + progress * travel;
      tileObj.el.style.top = topPos + 'px';

      if(progress > 0.78 && progress < 1){
        tileObj.el.classList.add('danger');
      }

      if(progress >= 1){
        tileObj.missed = true;
        tileObj.el.remove();
        tiles = tiles.filter(t => t !== tileObj);
        combo = 0;
        updateComboDisplay();
        loseLife();
        return;
      }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function spawnBurst(x, y){
    for(let i=0;i<8;i++){
      const p = document.createElement('div');
      p.className = 'burst';
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      document.getElementById('gameArea').appendChild(p);
      const angle = (Math.PI*2/8) * i;
      const dist = 40 + Math.random()*20;
      const dx = Math.cos(angle)*dist;
      const dy = Math.sin(angle)*dist;
      p.animate([
        { transform:'translate(0,0)', opacity:1 },
        { transform:`translate(${dx}px, ${dy}px)`, opacity:0 }
      ], { duration:400, easing:'ease-out' }).onfinish = () => p.remove();
    }
  }

  function hitTile(tileObj){
    if(tileObj.hit || tileObj.missed || !running) return;
    tileObj.hit = true;
    tileObj.el.classList.add('hitflash');

    const rect = tileObj.el.getBoundingClientRect();
    const appRect = app.getBoundingClientRect();
    spawnBurst(rect.left - appRect.left + rect.width/2, rect.top - appRect.top + rect.height/2);

    setTimeout(() => { tileObj.el.remove(); }, 90);
    tiles = tiles.filter(t => t !== tileObj);

    combo += 1;
    bestCombo = Math.max(bestCombo, combo);
    const comboMult = 1 + Math.floor(combo/10)*0.5;
    score += Math.round(10 * comboMult);
    scoreVal.textContent = score;
    updateComboDisplay();

    clickTimestamps.push(performance.now());
    const cutoff = performance.now() - 5000;
    clickTimestamps = clickTimestamps.filter(t => t > cutoff);
  }

  function updateComboDisplay(){
    if(combo >= 3){
      comboWrap.classList.add('show');
      comboVal.textContent = combo;
    } else {
      comboWrap.classList.remove('show');
    }
  }

  function updateCps(){
    if(!running) return;
    const now = performance.now();
    const windowMs = 3000;
    const cutoff = now - windowMs;
    const recent = clickTimestamps.filter(t => t > cutoff);
    const cps = recent.length / (windowMs/1000);
    cpsVal.textContent = cps.toFixed(1);
  }

  function clearAllTiles(){
    tiles.forEach(t => t.el.remove());
    tiles = [];
  }

  function startGame(){
    score = 0;
    combo = 0;
    fallDurationMs = baseFallDurationMs;
    bgMusic.currentTime = 0;
    bgMusic.volume = 0.6;
    bgMusic.play().catch(()=>{});
    bestCombo = 0;
    clickTimestamps = [];
    resetLives();
    clearAllTiles();
    scoreVal.textContent = '0';
    cpsVal.textContent = '0.0';
    updateComboDisplay();
    startOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    running = true;
    updateLaneHeight();
    if(beatSyncActive()){
      startBeatLoop();
    } else {
      spawnTile();
      if(musicReady) startFreeRunRampWatcher();
    }
    cpsInterval = setInterval(updateCps, 200);
  }

  function endGame(){
    running = false;
    bgMusic.pause();
    clearTimeout(spawnTimer);
    clearInterval(beatCheckInterval);
    clearInterval(cpsInterval);
    clearAllTiles();

    if(score > best){
      best = score;
      localStorage.setItem('tileRushBest', String(best));
    }
    bestVal.textContent = best;

    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalCombo').textContent = bestCombo;
    document.getElementById('finalCps').textContent = cpsVal.textContent;

    overOverlay.classList.remove('hidden');
  }

  startBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', startGame);
  menuBtn.addEventListener('click', () => {
    overOverlay.classList.add('hidden');
    startOverlay.classList.remove('hidden');
  });

  document.addEventListener('touchmove', function(e){ e.preventDefault(); }, { passive:false });

  updateLaneHeight();
})();
</script>
</body>
</html>
